<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0f2e">
<title>Schach</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="stage">
    <div class="pl" id="pTop"><b class="nm"></b><span class="cp"></span><span class="ck"></span></div>
    <div id="board" role="grid" aria-label="Schachbrett. Pfeiltasten bewegen den Fokus, Enter wählt aus oder zieht."></div>
    <div class="pl" id="pBot"><b class="nm"></b><span class="cp"></span><span class="ck"></span></div>
  </section>
  <aside class="panel">
    <div id="status" role="status" aria-live="polite"></div>
    <button id="menuBtn" class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">☰ Menü</button>
    <div class="menu" id="menu">
      <button id="menuX" class="menu-x" type="button" aria-label="Menü schliessen">✕</button>
      <h2>Neue Partie</h2>
      <label>Modus
        <select id="mode"><option value="bot">Spieler gegen Bot</option><option value="2p">Zwei Spieler lokal</option></select></label>
      <label class="bo">Schwierigkeit
        <select id="lvl"><option value="leicht">Leicht</option><option value="mittel" selected>Mittel</option><option value="schwer">Schwer</option></select></label>
      <label class="bo">Deine Farbe
        <select id="col"><option value="w">Weiss</option><option value="b">Schwarz</option><option value="z">Zufall</option></select></label>
      <label>Bedenkzeit
        <select id="time"><option value="0">Unbegrenzt</option><option value="5">5 Minuten</option><option value="10">10 Minuten</option><option value="15">15 Minuten</option></select></label>
      <div class="look" id="look" role="group" aria-label="Aussehen"></div>
      <button id="new" class="pri">Partie starten</button>

    </div>
  </aside>
</main>
<div id="scrim"></div>

<dialog id="promo" aria-label="Bauernumwandlung">
  <h2>Bauernumwandlung</h2><p>Wähle eine Figur:</p><div id="promoBtns"></div>
</dialog>
<dialog id="endDlg" aria-label="Spielende">
  <h2 id="endT"></h2><p id="endR"></p>
  <div class="dbtn"><button id="endNew" class="pri">Neues Spiel</button><button id="endClose">Brett ansehen</button></div>
</dialog>
<script src="script.js"></script>
</body>
</html>
